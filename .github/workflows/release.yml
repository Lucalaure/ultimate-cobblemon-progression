# Builds UCP and publishes a GitHub release with the mod jar attached.
#
# Run it from the Actions tab ("Release" > "Run workflow") once the version in build.gradle.kts and its
# "# UCP <version>" section in CHANGELOG.md are on main. It creates the tag (e.g. 2.1.0) on the commit it builds.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.1.0 (must match build.gradle.kts)"
        required: true
      notes:
        description: "Release notes in Markdown. Leave empty to use the version's section of CHANGELOG.md."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          built=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::build.gradle.kts has version $built, not $VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Build
        run: bash ./gradlew build --no-daemon

      - name: Release notes
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
          else
            # The "# UCP <version>" section of the changelog, without its heading.
            awk -v head="# UCP $VERSION" '$0 == head {found=1; next} /^# / && found {exit} found' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "::error::No release notes: pass them, or add a '# UCP $VERSION' section to CHANGELOG.md"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" "build/libs/ucp-fabric-$VERSION+mc1.21.1.jar" \
            --target "$GITHUB_SHA" --title "UCP $VERSION" --notes-file notes.md
